name: Build rsync image

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Use Docker cache
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened]
    paths: &image_paths
      - 'rsync/**'
      - '.github/workflows/image-rsync.yml'
      - '!rsync/**/*.md'
      - '!rsync/justfile'
  push:
    branches:
      - main
      - 'renovate/**'
    paths: *image_paths

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build and publish
    # Bot-triggered Renovate PR checks already run on push for branch automerge.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !(github.event.pull_request.user.login == 'renovate[bot]' &&
         github.triggering_actor == 'renovate[bot]' &&
         startsWith(github.head_ref, 'renovate/')))
    uses: ./.github/workflows/reusable-build-image.yml
    with:
      image_name: rsync
      publish: ${{ github.ref == 'refs/heads/main' }}
      use_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
    secrets: inherit
